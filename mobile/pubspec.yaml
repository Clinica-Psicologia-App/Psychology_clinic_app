name: terapia_esquema
description: EsquemaCore — seu raciocínio clínico em mapa
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  supabase_flutter: ^2.9.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  open_filex: ^4.7.0
  image_picker: ^1.1.2
  pdf: ^3.11.1
  share_plus: ^10.1.4
  cached_network_image: ^3.4.1
  flutter_svg: ^2.3.0
  video_player: ^2.9.2
  printing: ^5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/esquema_core_icon.png
  # Ícone oficial da marca (cérebro em rede) sobre fundo branco, como no guia
  # (painel "ÍCONE DO APP"). Foreground e legado usam o mesmo desenho.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/esquema_core_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/greeting/
    - assets/intro/
    - assets/mascot/
    - assets/fonts/
